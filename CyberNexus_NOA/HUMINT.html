<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>NOA — HUMINT</title>
<style>
  :root{
    --bg:#0b0b0d; --panel:#141417; --panel2:#1a1c21;
    --muted:#a3a8b3; --white:#fff; --yellow:#ffd400; --orange:#ffd400;
    --accent:linear-gradient(135deg,var(--yellow),var(--orange));
    --radius:18px; --ring:0 0 0 3px rgba(255,200,0,.25);
  }
  *{box-sizing:border-box}
  body{margin:0;background:
      radial-gradient(900px 520px at 110% -10%, rgba(255,212,0,.14), transparent 60%),
      radial-gradient(900px 520px at -10% 110%, rgba(255,212,0,.12), transparent 60%),
      var(--bg);color:var(--white);font:15px/1.5 system-ui,Segoe UI,Roboto,Ubuntu,Arial}
  /* HEADER + NAV */
  .header{position:sticky;top:0;z-index:10;backdrop-filter: blur(10px);
    background:rgba(12,12,15,.6);border-bottom:1px solid rgba(255,255,255,.06)}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;gap:16px}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{width:42px;height:42px;border-radius:12px;background:var(--accent);
    display:grid;place-items:center;color:#111;font-weight:900;box-shadow:0 10px 26px rgba(255,212,0,.35)}
  .title b{font-size:18px;letter-spacing:.4px}
  .title .sub{font-size:12px;color:#a3a8b3}
  .nav{display:flex;gap:10px;flex-wrap:wrap}
  .nav a{
    text-decoration:none;color:#111;background:var(--yellow);padding:8px 12px;border-radius:999px;
    font-weight:900;font-size:12px;display:inline-flex;align-items:center;gap:6px;
    box-shadow:0 6px 16px rgba(255,200,0,.25);transition:.15s}
  .nav a:hover{transform:translateY(-1px)}
  .nav .ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.2);box-shadow:none}

  /* LAYOUT */
  .container{max-width:1200px;margin:24px auto;padding:0 18px 80px}
  .grid{display:grid;gap:18px;grid-template-columns:260px 1fr}
  .sidebar{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.08);border-radius:var(--radius);padding:12px}
  .cat{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;cursor:pointer;
       background:var(--panel);border:1px solid rgba(255,255,255,.08);margin-bottom:8px;transition:.18s}
  .cat:hover{transform:translateY(-1px);border-color:rgba(255,180,0,.35)}
  .cat.active{background:linear-gradient(180deg,rgba(255,200,40,.10),rgba(255,212,0,.08));box-shadow:0 10px 20px rgba(255,200,0,.18)}
  .chip{font-size:11px;color:#111;background:var(--yellow);border-radius:999px;padding:2px 8px;font-weight:800}

  /* CONTENT */
  .card{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01));border:1px solid rgba(255,255,255,.08);
        border-radius:var(--radius);padding:16px}
  .badge{font-size:12px;font-weight:800;color:#111;background:var(--yellow);border-radius:999px;padding:4px 10px}
  .card h2{margin:0 0 12px;display:flex;align-items:center;gap:10px}
  .section{display:grid;gap:14px;grid-template-columns:1fr}
  .tools{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .tool{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--panel);
        border:1px solid rgba(255,255,255,.08);cursor:pointer;transition:.18s}
  .tool:hover{transform:translateY(-1px);border-color:rgba(255,190,0,.35)}
  .tool input{appearance:none;width:18px;height:18px;border-radius:6px;border:1.5px solid rgba(255,255,255,.4);display:grid;place-items:center}
  .tool input::after{content:"";width:12px;height:12px;border-radius:4px;background:transparent;transition:.18s}
  .tool input:checked{border-color:transparent}
  .tool input:checked::after{background:var(--accent)}
  textarea{width:100%;min-height:150px;padding:12px;border-radius:12px;background:var(--panel2);
           border:1px solid rgba(255,255,255,.1);color:#fff;outline:none;font-size:14px;resize:vertical}
  textarea:focus{box-shadow:var(--ring);border-color:rgba(255,200,0,.5)}

  /* Report bar */
  .reportbar{display:flex;gap:12px;align-items:center;margin:6px 0 2px}
  .reportbar input{flex:1;min-width:220px;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.15);
                   background:var(--panel2);color:#fff}

  .actions{display:flex;gap:10px;justify-content:flex-end}
  .btn{border:0;border-radius:14px;padding:12px 16px;font-weight:800;cursor:pointer;transition:.18s}
  .btn.primary{color:#111;background:var(--accent);box-shadow:0 8px 22px rgba(255,212,0,.35)}
  .btn.ghost{color:#fff;background:transparent;border:1px solid rgba(255,255,255,.12)}
  .toast{position:fixed;right:16px;bottom:16px;background:#101215;border:1px solid rgba(255,255,255,.12);
         padding:12px 14px;border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.45);max-width:360px;display:none}
  .toast b{color:#c8ff7a}.toast .err{color:#ff8a80}
</style>
</head>
<body>
<header class="header">
  <div class="topbar">
    <div class="brand">
      <div class="logo">NOA</div>
      <div class="title">
        <b>n8n OSINT automation</b>
        <div class="sub">HUMINT - Human Intelligence</div>
      </div>
    </div>
    <!-- NAV -->
    <nav class="nav">
      <a class="ghost" href="index.html">HOME</a>
      <a class="ghost" href="webint.html">WEBINT</a>
      <a class="ghost" href="socmint.html">SOCMINT</a>
      <a class="ghost" href="imint.html">IMINT</a>
      <a class="ghost" href="geoint.html">GEOINT</a>
      <a href="humint.html">HUMINT</a>
      <a href="apikey.html">API KEY</a>
    </nav>
  </div>
</header>

<main class="container">
  <div class="grid">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="cat active" data-cat="EMAIL"><span class="chip">EMAIL</span><span>Email tools</span></div>
      <div class="cat" data-cat="TELEFONO"><span class="chip">PHONE</span><span>Phone tools</span></div>
      <div class="cat" data-cat="AZIENDE"><span class="chip">COMPANIES</span><span>Company tools</span></div>
      <div class="cat" data-cat="FINANZA"><span class="chip">FINANCE</span><span>Financial tools</span></div>
      <div class="cat" data-cat="PERSONA"><span class="chip">PERSON</span><span>Person tools</span></div>
      <div class="cat" data-cat="VEICOLI"><span class="chip">VEHICLES</span><span>Vehicle tools</span></div>
    </aside>

    <!-- Content -->
    <section class="card">
      <h2><span class="badge" id="catBadge">EMAIL</span> <span id="catTitle">Email tools</span></h2>

      <div class="section">
        <!-- tools -->
        <div class="tools" id="toolsWrap"></div>

        <!-- single input -->
        <div>
          <textarea id="dataInput" placeholder='Select a tool to see the expected input (text or JSON).'></textarea>
        </div>

        <!-- Report bar -->
        <div class="reportbar">
          <input id="reportName" placeholder="Report name" />
          <label style="display:flex;align-items:center;gap:8px">
            <input type="checkbox" id="reportSave" checked>
            <span>Save to /reports</span>
          </label>
        </div>

        <div class="actions">
          <button class="btn ghost" id="clearBtn">Clear</button>
          <button class="btn primary" id="sendBtn">Run to selected tool</button>
        </div>
      </div>
    </section>
  </div>
</main>

<div id="toast" class="toast"></div>

<script>
  // === Config ===
  const WEBHOOK_BASE = "http://localhost:5679";
  const WEBHOOK_PATH = "/webhook/cb23b1f4-e035-482c-b0e2-fa81355311eb";

  // Categories -> tools (labels and exact "action" names)
  const CATEGORIES = {
    EMAIL: [
      { label: "EMAIL Validator", action: "EMAIL Validator" },
      { label: "Validect - Email Verification", action: "Validect - Email Verification" },
      { label: "Email Finder", action: "Email Finder" },
      { label: "Email Finder2", action: "Email Finder2" },
      { label: "Email Search", action: "Email Search" },
      { label: "email verification", action: "search_emailverification" },
      { label: "hunter email finder", action: "search_hunteremailfinder" },
      { label: "hunter email verifier", action: "search_hunteremailverifier" },
      { label: "hunter person enrichment", action: "search_hunterpersonenrichment" },
      { label: "Disposable Email Checker", action: "search_disposableEmailChecker" },
      { label: "disifyEmail", action: "disifyEmail" },
      { label: "disifyDomain", action: "disifyDomain" },
      { label: "sublime", action: "sublime" },
      { label: "leakcheck", action: "leakcheck" },
      { label: "bdc_email", action: "search_bdc_email" },
      { label: "abstractapi", action: "search_abstractapi" }
    ],
    TELEFONO: [
      { label: "Truecaller Data", action: "Truecaller Data" },
      { label: "PhoneNumberValidateFree", action: "PhoneNumberValidateFree" },
      { label: "Veriphone", action: "Veriphone" },
      { label: "ViewCaller", action: "ViewCaller" },
      { label: "Number Verification", action: "search_numberverification" },
      { label: "veriphone", action: "search_veriphone" },
      { label: "ValidatePhone", action: "search_validatePhone" },
      { label: "bdc_number", action: "search_bdc_number" }
    ],
    AZIENDE: [
      { label: "Local Business Data", action: "Local Business Data" },
      { label: "Company Data", action: "Company Data" },
      { label: "Local Business Search", action: "Local Business Search" },
      { label: "Open Corporates", action: "search_opencorporates" },
      { label: "hunter company enrichment", action: "search_huntercompanyenrichment" },
      { label: "clearbit autocomplete", action: "search_clearbitautocomplete" },
      { label: "openBRIS", action: "search_openbris" },
      { label: "Wikipedia", action: "search_wikipedia" }
    ],
    FINANZA: [
      { label: "vat validation", action: "search_vatvalidation" },
      { label: "bank data", action: "search_bankdata" },
      { label: "vatcheck", action: "search_vatcheck" },
      { label: "ibanapi", action: "search_ibanapi" },
      { label: "marketcap", action: "search_marketcap" },
      { label: "swiftcode", action: "search_swiftcode" },
      { label: "IBAN validation", action: "IBAN validation" }
    ],
    PERSONA: [
      { label: "genderize", action: "genderize" },
      { label: "nationalize", action: "nationalize" }
    ],
    VEICOLI: [
      { label: "cars", action: "search_cars" },
      { label: "electricVehicle", action: "search_electricVehicle" },
      { label: "helicopter", action: "search_helicopter" },
      { label: "motorcycles", action: "search_motorcycles" }
    ]
  };

  // Section titles (English)
  const titleMap = {
    EMAIL:'Email tools',
    TELEFONO:'Phone tools',
    AZIENDE:'Company tools',
    FINANZA:'Financial tools',
    PERSONA:'Person tools',
    VEICOLI:'Vehicle tools'
  };

  // Dynamic placeholders per tool (English) — from the provided document
  const PLACEHOLDER_BY_ACTION = {
    /* EMAIL */
    "EMAIL Validator": "Enter email address (e.g., john.doe@gmail.com)",
    "Validect - Email Verification": "Enter email address (e.g., john.doe@gmail.com)",
    "Email Finder": "Enter email domain (e.g., gmail.com)",
    "Email Finder2": "Enter first name and email domain (e.g., Mario, gmail.com)",
    "Email Search": "Enter full name and company domain (e.g., Mario Rossi, microsoft.it)",
    "search_emailverification": "Enter email address (e.g., john.doe@gmail.com)",
    "search_hunteremailfinder": "Enter company domain, first name, last name (e.g., itsumbria.it, Marco, Amici)",
    "search_hunteremailverifier": "Enter email address (e.g., john.doe@gmail.com)",
    "search_hunterpersonenrichment": "Enter corporate email address (e.g., mario.rossi@microsoft.it)",
    "search_disposableEmailChecker": "Enter email address (e.g., john.doe@gmail.com)",
    "disifyEmail": "Enter email address (e.g., john.doe@gmail.com)",
    "disifyDomain": "Enter domain (e.g., mailnator.com)",
    "leakcheck": "Enter email or username (e.g., john.doe@gmail.com)",
    "search_bdc_email": "Enter email address (e.g., john.doe@gmail.com)",
    "search_abstractapi": "Enter email address (e.g., john.doe@gmail.com)",
    // "sublime": no data in doc -> will fall back to generic

    /* PHONE */
    "Truecaller Data": "Enter phone number in international format (e.g., +393420033820)",
    "PhoneNumberValidateFree": "Enter phone number in international format (e.g., +393420033820)",
    "Veriphone": "Enter phone number in international format (e.g., +393420033820)",
    "ViewCaller": "Enter country prefix and number (e.g., +39, 3420033820)",
    "search_numberverification": "Enter phone number in international format (e.g., +393420033820",
    "search_veriphone": "Enter phone number in international format (e.g., +393420033820)",
    "search_validatePhone": "Enter phone number with optional ISO code (e.g., 3420033820, IT or +393420033820)",
    "search_bdc_number": "Enter phone number and ISO country code (e.g., 3420033820, IT)",

    /* COMPANIES */
    "Local Business Data": "Enter business name (e.g., Pizzeria Perugia)",
    "Company Data": "Enter external API key, email, URL, company domain (comma-separated) (e.g., <key>, marco.nemici@itsumbria.it, https://www.itsumbria.it, itsumbria.it)",
    "Local Business Search": "Enter unique business code (e.g., KRRH6B9)",
    "search_opencorporates": "Enter company name (e.g., Apple)",
    "search_huntercompanyenrichment": "Enter company domain (e.g., microsoft.it)",
    "search_clearbitautocomplete": "Enter partial company name (e.g., itsumbr)",
    "search_openbris": "Enter country code and Business ID (e.g., SVK, 35702179)",
    "search_wikipedia": "Enter Wikipedia article title (e.g., Tower of Pisa)",

    /* FINANCE */
    "search_vatvalidation": "Enter full VAT number (e.g., DE258752835)",
    "search_bankdata": "Enter IBAN (e.g., DE89370400440532013000)",
    "search_vatcheck": "Enter full VAT number (e.g., DE258752835)",
    "search_ibanapi": "Enter IBAN (e.g., DE89370400440532013000)",
    "search_marketcap": "Enter stock ticker (e.g., AAPL)",
    "search_swiftcode": "Enter SWIFT/BIC code (e.g., DEUTDEFF)",
    "IBAN validation": "Enter external API key and IBAN (comma-separated) (e.g., 0ea186..., IT60X0542811101000000123456)",

    /* PERSON */
    "genderize": "Enter given name (e.g., Luca)",
    "nationalize": "Enter given name (e.g., Andrea)",

    /* VEHICLES */
    "search_cars": "Enter manufacturer, model, fuel type, drivetrain, transmission, model year (optional) (e.g., Ford, Mustang, Gas, RWD, Manual, 1967)",
    "search_electricVehicle": "Enter brand, model, start year, end year, min range (km), max range (km) (optional) (e.g., Tesla, Model 3, 2020, 2023, 200, 350)",
    "search_helicopter": "Enter manufacturer, model, min speed (kt), max speed (kt), min range (nm), max range (nm), min length (ft), max length (ft), min height (ft), max height (ft) (e.g., Airbus, H130, 100, 160, 300, 450, 30, 45, 10, 14)",
    "search_motorcycles": "Enter manufacturer, model, release year (optional) (e.g., Honda, CBR 600, 2022)"
  };

  const DEFAULT_PLACEHOLDER = "Select a tool to see the expected input (text or JSON).";

  let currentCat = "EMAIL";
  renderCategory(currentCat);

  // Sidebar click
  document.getElementById('sidebar').addEventListener('click', (e) => {
    const item = e.target.closest('.cat');
    if(!item) return;
    [...document.querySelectorAll('.cat')].forEach(c => c.classList.remove('active'));
    item.classList.add('active');
    currentCat = item.dataset.cat;
    renderCategory(currentCat);
  });

  // Render category + tools
  function renderCategory(cat){
    document.getElementById('catBadge').textContent = chipTitle(cat);
    document.getElementById('catTitle').textContent = titleMap[cat] || '';

    const wrap = document.getElementById('toolsWrap');
    wrap.innerHTML = '';
    (CATEGORIES[cat] || []).forEach(({label, action}, idx) => {
      const id = slug(action) + "-" + idx;
      const div = document.createElement('div');
      div.className = 'tool';
      div.innerHTML = `
        <input type="checkbox" id="${id}" data-action="${escapeHTML(action)}" data-label="${escapeHTML(label)}">
        <label for="${id}" style="cursor:pointer">${label}</label>`;
      wrap.appendChild(div);
    });

    // reset textarea placeholder
    setPlaceholder(DEFAULT_PLACEHOLDER);

    // enforce single selection + dynamic placeholder
    wrap.addEventListener('change', onToolToggle, { once:true });
  }

  function onToolToggle(e){
    const input = e.target.closest('input[type="checkbox"]');
    if(!input) return;

    if(input.checked){
      // uncheck all others
      document.querySelectorAll('#toolsWrap input[type="checkbox"]').forEach(cb=>{
        if(cb !== input) cb.checked = false;
      });
      // set placeholder for this tool
      const action = input.dataset.action;
      const ph = PLACEHOLDER_BY_ACTION[action] || DEFAULT_PLACEHOLDER;
      setPlaceholder(ph);
    }else{
      // none selected -> default placeholder
      setPlaceholder(DEFAULT_PLACEHOLDER);
    }

    // keep listening for further changes in this category
    document.getElementById('toolsWrap').addEventListener('change', onToolToggle, { once:true });
  }

  function setPlaceholder(text){
    const ta = document.getElementById('dataInput');
    ta.value = '';
    ta.placeholder = text;
  }

  function chipTitle(cat){
    switch(cat){
      case 'EMAIL': return 'EMAIL';
      case 'TELEFONO': return 'PHONE';
      case 'AZIENDE': return 'COMPANIES';
      case 'FINANZA': return 'FINANCE';
      case 'PERSONA': return 'PERSON';
      case 'VEICOLI': return 'VEHICLES';
      default: return cat;
    }
  }

  function slug(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-'); }
  function escapeHTML(s){ return String(s).replace(/[&<>'"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m])); }

  // Buttons
  document.getElementById('clearBtn').addEventListener('click', () => {
    document.getElementById('dataInput').value='';
    document.querySelectorAll('#toolsWrap input[type=checkbox]').forEach(cb => cb.checked=false);
    setPlaceholder(DEFAULT_PLACEHOLDER);
  });

  document.getElementById('sendBtn').addEventListener('click', async () => {
    const selected = [...document.querySelectorAll('#toolsWrap input[type=checkbox]:checked')]
      .map(i => i.dataset.action);
    if(selected.length === 0) return toast('Select one tool.');
    if(selected.length > 1)   return toast('Only one tool can be selected.');

    const raw = document.getElementById('dataInput').value.trim();
    if(!raw) return toast('Enter a value in the field.');

    const meta = {
      save: document.getElementById('reportSave')?.checked === true,
      name: (document.getElementById('reportName')?.value || '').trim() || null
    };

    try{
      await send(selected[0], raw, meta);
      toast(`<b>OK</b>: available result of 1 tool (HUMINT).`);
    }catch(e){
      toast(`<span class="err">Error</span>: ${escapeHTML(e.message||String(e))}`);
    }
  });

  // Send
  async function send(action, raw, meta){
    const url = WEBHOOK_BASE + WEBHOOK_PATH;
    let data; try { data = JSON.parse(raw); } catch { data = raw; }
    try{
      const res = await fetch(url, {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ action, data, meta, section: 'HUMINT' })
      });
      if(!res.ok && res.status !== 0){
        const t = await res.text().catch(()=> '');
        throw new Error(`HTTP ${res.status} ${t || ''}`.trim());
      }
    }catch(err){
      const msg = String(err && (err.message || err));
      if (msg.toLowerCase().includes('failed to fetch') || msg.toLowerCase().includes('networkerror')){
        return; // silent: workflow likely triggered
      }
      throw err;
    }
  }

  // Toast
  const toastEl = document.getElementById('toast'); let hideTimer;
  function toast(html){
    toastEl.innerHTML = html;
    toastEl.style.display = 'block';
    clearTimeout(hideTimer);
    hideTimer = setTimeout(()=> toastEl.style.display='none', 4000);
  }
</script>
</body>
</html>
