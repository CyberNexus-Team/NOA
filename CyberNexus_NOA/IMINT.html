<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>NOA — IMINT</title>
<style>
  :root{
    /* Tema IMINT — arancione scuro */
    --bg:#110b06; --panel:#191009; --panel2:#20140a;
    --muted:#ffe6d1; --white:#fff;
    --orange:#ff7a18; --burnt:#c2410c;              /* primari */
    --chip:#fff1e6;
    --accent:linear-gradient(135deg,var(--orange),var(--burnt));
    --radius:18px; --ring:0 0 0 3px rgba(255,122,24,.30);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:
      radial-gradient(900px 520px at 110% -10%, rgba(255,122,24,.12), transparent 60%),
      radial-gradient(900px 520px at -10% 110%, rgba(194,65,12,.12), transparent 60%),
      var(--bg);
    color:var(--white);
    font:15px/1.5 system-ui, Segoe UI, Roboto, Ubuntu, Arial;
  }

  /* HEADER + NAV */
  .header{position:sticky;top:0;z-index:10;backdrop-filter: blur(10px);
    background:rgba(17,11,6,.65);border-bottom:1px solid rgba(255,255,255,.06)}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;gap:16px}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{width:42px;height:42px;border-radius:12px;background:var(--accent);
    display:grid;place-items:center;color:#1f1207;font-weight:900;box-shadow:0 10px 26px rgba(255,122,24,.28)}
  .title b{font-size:18px;letter-spacing:.4px}
  .title .sub{font-size:12px;color:var(--muted)}
  .nav{display:flex;gap:10px;flex-wrap:wrap}
  .nav a{
    text-decoration:none;color:#1a0e06;background:var(--chip);padding:8px 12px;border-radius:999px;
    font-weight:900;font-size:12px;display:inline-flex;align-items:center;gap:6px;
    box-shadow:0 6px 16px rgba(255,122,24,.20);transition:.15s}
  .nav a:hover{transform:translateY(-1px)}
  .nav .ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.20);box-shadow:none}
  .nav .current{background:var(--accent);color:#1a0e06}

  /* LAYOUT */
  .container{max-width:1200px;margin:24px auto;padding:0 18px 80px}
  .grid{display:grid;gap:18px;grid-template-columns:260px 1fr}
  .sidebar{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
           border:1px solid rgba(255,255,255,.08);border-radius:var(--radius);padding:12px}
  .cat{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;cursor:pointer;
       background:var(--panel);border:1px solid rgba(255,255,255,.08);margin-bottom:8px;transition:.18s}
  .cat:hover{transform:translateY(-1px);border-color:rgba(255,122,24,.38)}
  .cat.active{background:linear-gradient(180deg,rgba(255,122,24,.12),rgba(194,65,12,.10));box-shadow:0 10px 22px rgba(255,122,24,.22)}
  .chip{font-size:11px;color:#1a0e06;background:var(--chip);border-radius:999px;padding:6px 10px;font-weight:800}

  /* CONTENT */
  .card{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01));border:1px solid rgba(255,255,255,.08);
        border-radius:var(--radius);padding:16px}
  .badge{font-size:12px;font-weight:800;color:#1a0e06;background:var(--accent);border-radius:999px;padding:4px 10px}
  .card h2{margin:0 0 12px;display:flex;align-items:center;gap:10px}
  .section{display:grid;gap:14px;grid-template-columns:1fr}
  .tools{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .tool{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--panel);
        border:1px solid rgba(255,255,255,.08);cursor:pointer;transition:.18s}
  .tool:hover{transform:translateY(-1px);border-color:rgba(255,122,24,.35)}
  .tool input{appearance:none;width:18px;height:18px;border-radius:6px;border:1.5px solid rgba(255,255,255,.40);display:grid;place-items:center}
  .tool input::after{content:"";width:12px;height:12px;border-radius:4px;background:transparent;transition:.18s}
  .tool input:checked{border-color:transparent}
  .tool input:checked::after{background:var(--accent)}

  .actions{display:flex;gap:10px;justify-content:flex-end}
  .btn{border:0;border-radius:14px;padding:12px 16px;font-weight:800;cursor:pointer;transition:.18s}
  .btn.primary{color:#1a0e06;background:var(--accent);box-shadow:0 8px 22px rgba(255,122,24,.35)}
  .btn.ghost{color:#fff;background:transparent;border:1px solid rgba(255,255,255,.12)}
  .toast{position:fixed;right:16px;bottom:16px;background:#1a120a;border:1px solid rgba(255,255,255,.12);
         padding:12px 14px;border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.45);max-width:360px}
  .toast b{color:#ffe7c9}.toast .err{color:#ff9aa5}

  /* Upload */
  .drop{border:1px dashed rgba(255,255,255,.22);background:var(--panel2);
        border-radius:14px;padding:16px;display:grid;gap:10px;place-items:center;text-align:center}
  .thumb{max-width:220px;max-height:220px;border-radius:12px;border:1px solid rgba(255,255,255,.08)}
  .hint{color:var(--muted);font-size:12px}

  /* Report bar */
  .reportbar{display:flex;gap:12px;align-items:center;margin:6px 0 2px}
  .reportbar input{flex:1;min-width:220px;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.15);
                   background:var(--panel2);color:#fff}

  /* Layout helper per Recognito (due upload affiancati) */
  .cols2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
</style>
</head>
<body>
<header class="header">
  <div class="topbar">
    <div class="brand">
      <div class="logo">NOA</div>
      <div class="title">
        <b>n8n osint automation</b>
        <div class="sub">IMINT - Imagery Intelligence</div>
      </div>
    </div>
    <nav class="nav">
      <a class="ghost" href="index.html">HOME</a>
      <a class="ghost" href="webint.html">WEBINT</a>
      <a class="ghost" href="socmint.html">SOCMINT</a>
      <a class="current" href="imint.html">IMINT</a>
      <a class="ghost" href="geoint.html">GEOINT</a>
      <a class="ghost" href="humint.html">HUMINT</a>
      <a href="apikey.html">API KEY</a>
    </nav>
  </div>
</header>

<main class="container">
  <div class="grid">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="cat active" data-cat="FACE"><span class="chip">FACE DETECTION</span><span>URL or File</span></div>
      <div class="cat" data-cat="REVERSE"><span class="chip">REVERSE IMAGE SEARCH</span><span>URL</span></div>
      <div class="cat" data-cat="OCR"><span class="chip">IMAGE TO TEXT</span><span>File</span></div>
      <div class="cat" data-cat="OBJECT"><span class="chip">OBJECT DETECTION</span><span>File</span></div>
    </aside>

    <!-- Content -->
    <section class="card">
      <h2><span class="badge" id="catBadge">FACE DETECTION</span> <span id="catTitle">Da URL o File</span></h2>

      <div class="section">
        <div class="tools" id="toolsWrap"></div>

        <!-- Pannello dinamico per categoria -->
        <div id="dataPanel"></div>

        <!-- Report bar -->
        <div class="reportbar">
          <input id="reportName" placeholder="Report Name" />
          <label style="display:flex;align-items:center;gap:8px">
            <input type="checkbox" id="reportSave" checked>
            <span>Save to /reports</span>
          </label>
        </div>

        <div class="actions">
          <button class="btn ghost" id="clearBtn">Clean</button>
          <button class="btn primary" id="sendBtn">Run selected tool</button>
        </div>
      </div>
    </section>
  </div>
</main>

<div id="toast" class="toast" style="display:none"></div>

<script>
  // === Config invio ===
  const WEBHOOK_BASE = "http://localhost:5679";
  const WEBHOOK_PATH = "/webhook/cb23b1f4-e035-482c-b0e2-fa81355311eb";

  // Categorie + tools (azioni ESATTE)
  const CATEGORIES = {
    FACE: [
      { label: "Face detection", action: "Face detection" },
      { label: "FaceDetect",    action: "facedetect" },
      { label: "Recognito",            action: "Recognito" } // inviato con 2 file
    ],
    REVERSE: [
      { label: "Reverse Image Search", action: "Reverse Image Search" }
    ],
    OCR: [
      { label: "ImageToText", action: "imagetotext" }
    ],
    OBJECT: [
      { label: "ObjectDetection", action: "objectdetection" }
    ]
  };

  // Tipi di input per azione
  const urlActions  = new Set(["Face detection","Reverse Image Search"]);
  const fileActions = new Set(["facedetect","imagetotext","objectdetection"]); // Recognito gestito a parte

  let currentCat = "FACE";

  // Stato file caricati
  let uploaded = null;      // singolo (FILE tools)
  let uploadedA = null;     // Recognito - File A
  let uploadedB = null;     // Recognito - File B

  // Render iniziale
  renderTools(currentCat);
  renderPanel(currentCat);

  // Sidebar click
  document.getElementById('sidebar').addEventListener('click', (e)=>{
    const item = e.target.closest('.cat'); if(!item) return;
    [...document.querySelectorAll('.cat')].forEach(c=>c.classList.remove('active'));
    item.classList.add('active');
    const cat = currentCat = item.dataset.cat;
    document.getElementById('catBadge').textContent = item.querySelector('.chip').textContent;
    document.getElementById('catTitle').textContent =
      cat==='FACE' ? 'URL or File' :
      cat==='REVERSE' ? 'URL' :
      cat==='OCR' ? 'File' : 'File';

    renderTools(cat);
    renderPanel(cat);
  });

  function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }
  function escapeHTML(s){ return String(s).replace(/[&<>'"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m])); }

  function renderTools(cat){
    const wrap = document.getElementById('toolsWrap');
    wrap.innerHTML = '';
    (CATEGORIES[cat] || []).forEach(({label, action}, idx) => {
      const id = slug(action) + "-" + idx;
      const div = document.createElement('div');
      div.className = 'tool';
      div.innerHTML = `
        <input type="checkbox" id="${id}" data-action="${escapeHTML(action)}">
        <label for="${id}" style="cursor:pointer">${label}</label>`;
      wrap.appendChild(div);
    });
  }

  function renderPanel(cat){
    const wrap = document.getElementById('dataPanel');
    wrap.innerHTML = '';

    // URL input (FACE & REVERSE)
    if(cat === 'REVERSE' || cat === 'FACE'){
      const urlGroup = document.createElement('div');
      urlGroup.innerHTML = `
        <label>Image URL</label>
        <input id="urlInput" placeholder="https://... .jpg/.png"
               style="width:100%;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:var(--panel2);color:#fff" />
      `;
      wrap.appendChild(urlGroup);
    }

    // FILE input singolo (FACE, OCR, OBJECT)
    if(cat === 'FACE' || cat === 'OCR' || cat === 'OBJECT'){
      const drop = document.createElement('div'); drop.className='drop';
      const extraHint = cat === 'OCR' ? ' • max 200KB' : '';
      drop.innerHTML = `
        <div>
          <input id="fileInput" type="file" accept="image/png,image/jpeg" />
        </div>
        <img id="thumb" class="thumb" style="display:none" />
        <div class="hint">PNG o JPEG${extraHint}</div>
      `;
      wrap.appendChild(drop);

      // setup preview + (solo OCR) controllo 200KB
      const fileInput = drop.querySelector('#fileInput');
      const thumb = drop.querySelector('#thumb');
      uploaded = null;
      fileInput.addEventListener('change', async (e)=>{
        const f = e.target.files && e.target.files[0];
        if(!f){ uploaded=null; thumb.style.display='none'; return; }
        if(!/^image\/(png|jpe?g)$/i.test(f.type)){
          toast('<span class="err">Invalid format</span>: usa PNG o JPEG.');
          fileInput.value=''; return;
        }
        if(cat === 'OCR' && f.size > 200*1024){
          toast('<span class="err">The image exceeds 200KB</span>: riduci il file per ImageToText.');
          fileInput.value=''; return;
        }
        const base64 = await fileToDataURL(f);
        uploaded = { filename:f.name, mime:f.type, size:f.size, base64 };
        thumb.src = base64; thumb.style.display='block';
      });
    }

    // BLOCCO SPECIFICO: Recognito (sempre visibile sotto in FACE)
    if(cat === 'FACE'){
      const box = document.createElement('div');
      box.style.marginTop = '8px';
      box.innerHTML = `
        <div style="font-weight:800;margin:4px 0 6px">Recognito — upload two images</div>
        <div class="cols2">
          <div class="drop">
            <div><input id="fileA" type="file" accept="image/png,image/jpeg" /></div>
            <img id="thumbA" class="thumb" style="display:none" />
            <div class="hint">Image A (PNG/JPEG)</div>
          </div>
          <div class="drop">
            <div><input id="fileB" type="file" accept="image/png,image/jpeg" /></div>
            <img id="thumbB" class="thumb" style="display:none" />
            <div class="hint">Image B (PNG/JPEG)</div>
          </div>
        </div>
      `;
      wrap.appendChild(box);

      // listeners A/B
      uploadedA = null; uploadedB = null;
      const fileA = box.querySelector('#fileA');
      const fileB = box.querySelector('#fileB');
      const thumbA = box.querySelector('#thumbA');
      const thumbB = box.querySelector('#thumbB');

      fileA.addEventListener('change', async (e)=>{
        const f = e.target.files && e.target.files[0];
        if(!f){ uploadedA=null; thumbA.style.display='none'; return; }
        if(!/^image\/(png|jpe?g)$/i.test(f.type)){ toast('<span class="err">Formato A non valido</span>'); fileA.value=''; return; }
        const base64 = await fileToDataURL(f);
        uploadedA = { filename:f.name, mime:f.type, size:f.size, base64 };
        thumbA.src = base64; thumbA.style.display='block';
      });
      fileB.addEventListener('change', async (e)=>{
        const f = e.target.files && e.target.files[0];
        if(!f){ uploadedB=null; thumbB.style.display='none'; return; }
        if(!/^image\/(png|jpe?g)$/i.test(f.type)){ toast('<span class="err">Formato B non valido</span>'); fileB.value=''; return; }
        const base64 = await fileToDataURL(f);
        uploadedB = { filename:f.name, mime:f.type, size:f.size, base64 };
        thumbB.src = base64; thumbB.style.display='block';
      });
    }
  }

  // Helpers
  function fileToDataURL(file){
    return new Promise((res,rej)=>{
      const r=new FileReader();
      r.onload=()=>res(r.result);
      r.onerror=rej;
      r.readAsDataURL(file);
    });
  }

  // Pulsanti
  document.getElementById('clearBtn').addEventListener('click', () => {
    document.querySelectorAll('#toolsWrap input[type=checkbox]').forEach(cb => cb.checked=false);
    const url = document.getElementById('urlInput'); if(url) url.value='';
    const fi = document.getElementById('fileInput'); if(fi) fi.value='';
    const th = document.getElementById('thumb'); if(th) th.style.display='none';
    const fa = document.getElementById('fileA'); if(fa) fa.value='';
    const fb = document.getElementById('fileB'); if(fb) fb.value='';
    const ta = document.getElementById('thumbA'); if(ta) ta.style.display='none';
    const tb = document.getElementById('thumbB'); if(tb) tb.style.display='none';
    uploaded = uploadedA = uploadedB = null;
  });

  document.getElementById('sendBtn').addEventListener('click', async () => {
    const selected = [...document.querySelectorAll('#toolsWrap input[type=checkbox]:checked')].map(i=>i.dataset.action);
    if(selected.length===0) return toast('Select at least one tool.');

    const needsUrl        = selected.some(a => urlActions.has(a));
    const needsSingleFile = selected.some(a => fileActions.has(a));
    const needsPair       = selected.includes("Recognito");

    const urlVal = (document.getElementById('urlInput')?.value || '').trim();
    if(needsUrl && !urlVal) return toast('Enter the image URL.');
    if(needsSingleFile && !uploaded) return toast('Upload a PNG or JPEG image.');
    if(needsPair && (!uploadedA || !uploadedB)) return toast('Upload both images A and B to Recognito.');

    const meta = {
      save: document.getElementById('reportSave')?.checked === true,
      name: (document.getElementById('reportName')?.value || '').trim() || null
    };

    try{
      await Promise.all(selected.map(action => {
        let data;
        if(action === "Recognito"){
          data = { file1: uploadedA, file2: uploadedB }; // inviati insieme
        }else if (urlActions.has(action)){
          data = urlVal;
        }else{
          data = uploaded;
        }
        return send(action, data, meta);
      }));
      toast(`<b>OK</b>: available result of ${selected.length} tool (IMINT).`);
    }catch(e){
      toast(`<span class="err">Errore</span>: ${escapeHTML(e.message||String(e))}`);
    }
  });

  // Invio con gestione “anti-falso-errore”
  async function send(action, data, meta){
    const url = WEBHOOK_BASE + WEBHOOK_PATH;
    try{
      const res = await fetch(url, {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ action, data, meta, section: 'IMINT' })
      });
      if(!res.ok && res.status !== 0){
        const t = await res.text().catch(()=> '');
        throw new Error(`HTTP ${res.status} ${t || ''}`.trim());
      }
    }catch(err){
      const msg = String(err && (err.message || err));
      if (msg.toLowerCase().includes('failed to fetch') || msg.toLowerCase().includes('networkerror')) {
        return; // silenzioso
      }
      throw err;
    }
  }

  // Toast
  const toastEl = document.getElementById('toast'); let hideTimer;
  function toast(html){
    toastEl.innerHTML = html;
    toastEl.style.display = 'block';
    clearTimeout(hideTimer);
    hideTimer = setTimeout(()=> toastEl.style.display='none', 4200);
  }
</script>
</body>
</html>
