# nginx.conf

# Upstream: usa la porta esposta sull'host (funziona sempre su Docker Desktop)
upstream n8n_upstream {
  server host.docker.internal:5678;
}

server {
  listen 80;

  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log notice;

  # ===== Endpoint NOA PDF =====
  location = /noa/pdf {

    # Preflight (anche se in genere è GET, lo lasciamo per coerenza)
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
      add_header Access-Control-Allow-Credentials "false" always;
      add_header Access-Control-Max-Age 86400 always;
      add_header Content-Length 0;
      add_header Content-Type text/plain;
      return 204;
    }

    proxy_pass http://n8n_upstream/webhook/noa/pdf;
    proxy_http_version 1.1;

    proxy_connect_timeout 15s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Credentials "false" always;
    add_header Access-Control-Expose-Headers "Content-Type, Authorization" always;

    client_max_body_size 20m;
  }

  # ===== Endpoint NOA DOCX =====
  location = /noa/docx {

    # Preflight
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
      add_header Access-Control-Allow-Credentials "false" always;
      add_header Access-Control-Max-Age 86400 always;
      add_header Content-Length 0;
      add_header Content-Type text/plain;
      return 204;
    }

    proxy_pass http://n8n_upstream/webhook/noa/docx;
    proxy_http_version 1.1;

    proxy_connect_timeout 15s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Credentials "false" always;
    add_header Access-Control-Expose-Headers "Content-Type, Authorization" always;

    client_max_body_size 20m;
  }

  # ===== Webhook generici con CORS (senza credenziali) =====
  location ~* ^/(webhook|webhook-test)(/.*)?$ {

    # Preflight
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
      add_header Access-Control-Allow-Credentials "false" always;
      add_header Access-Control-Max-Age 86400 always;
      add_header Content-Length 0;
      add_header Content-Type text/plain;
      return 204;
    }

    proxy_pass http://n8n_upstream;
    proxy_http_version 1.1;

    proxy_connect_timeout 15s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Credentials "false" always;
    add_header Access-Control-Expose-Headers "Content-Type, Authorization" always;

    client_max_body_size 20m;
  }

  # ===== UI n8n e tutto il resto =====
  location / {
    proxy_pass http://n8n_upstream;
    proxy_http_version 1.1;

    proxy_connect_timeout 15s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
  }
}
